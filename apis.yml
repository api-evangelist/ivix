aid: ivix
name: IVIX
description: >-
  IVIX is an AI-powered financial-intelligence platform that analyzes publicly
  available data at scale to surface hidden and unreported business activity,
  helping government tax authorities and law-enforcement agencies combat the
  shadow economy, tax evasion, and financial crime. The platform ingests open
  and third-party data to detect non-compliant businesses, quantify unreported
  revenue (including short-term rentals and crypto markets), and map illicit
  networks for enforcement teams. IVIX is a closed, government-facing product —
  it is sold and deployed with authorities rather than exposed as a public
  self-serve API — and it is ISO/IEC 27001:2022 certified for information
  security. Backed by Insight Partners; headquartered in New York with former
  IRS Commissioner Charles Rettig on its board of advisors.
